---
- name: Install WebSphere ND fix packs and interim fixes
  hosts: dmgr:was_servers
  become: true
  roles:
    - role: roles/third_party/ibm/wasnd/was-nd-fix-install
      tags:
        - was-fixes
        - all-fixes

- name: Install IHS and plug-in fix packs and interim fixes
  hosts: ihs_servers
  become: true
  roles:
    - role: roles/third_party/ibm/ihs9/ibm-http-server-9-fix-install
      tags:
        - ihs-fixes
        - plugin-fixes
        - all-fixes
