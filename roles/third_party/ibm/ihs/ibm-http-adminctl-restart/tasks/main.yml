---
- name:          "Is AdminCtl Running?"
  shell:         ps -p `cat "{{ __ihs_install_location }}/logs/admin.pid"`
  register:      ihs_is_running
  failed_when:   false
  changed_when:  false

- name:          "Stop AdminCtl"
  command:       "{{ __ihs_install_location }}/bin/adminctl stop"
  register:      cout
  changed_when:  cout.rc == 0
  when:          ihs_is_running.rc == 0

- name:          Wait for AdminCtl process to stop
  ansible.builtin.shell: >-
    ps -p "$(cat '{{ __ihs_install_location }}/logs/admin.pid')" > /dev/null
  register:      adminctl_stopped_check
  failed_when:   false
  changed_when:  false
  retries:       5
  delay:         2
  until:         adminctl_stopped_check.rc != 0

- name:          "Is AdminCtl Running?"
  shell:         ps -p `cat "{{ __ihs_install_location }}/logs/admin.pid"`
  register:      ihs_is_running
  failed_when:   false
  changed_when:  false

- name:          "Start AdminCtl"
  command:       "{{ __ihs_install_location }}/bin/adminctl start"
  register:      ihs_start
  changed_when:  ihs_start.rc == 0
  failed_when:   ihs_start.rc != 0
  when:          ihs_is_running.rc != 0

- name:          "Is AdminCtl Running?"
  shell:         ps -p `cat "{{ __ihs_install_location }}/logs/admin.pid"`
  register:      ihs_is_running
  failed_when:   false
  changed_when:  false
  when:          (ihs_start.rc is defined) and (ihs_start.rc == 0)

- name:          Wait for AdminCtl port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ihs_admin_port | default(8085) }}"
    state: started
    delay: 2
    timeout: 120
  when:          (ihs_start.rc is defined) and (ihs_start.rc == 0)
