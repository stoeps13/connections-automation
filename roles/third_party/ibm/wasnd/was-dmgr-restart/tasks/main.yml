---
- name:          "Is dmgr Running?"
  shell:         "ps -p `cat '{{ __was_install_location }}/profiles/{{ __profile_name }}/logs/dmgr/dmgr.pid'` > /dev/null"
  register:      dmgr_is_running
  failed_when:   false
  changed_when:  false

- name:          "Stop Dmgr"
  command:       "{{ __was_install_location }}/profiles/{{ __profile_name }}/bin/stopManager.sh  -username {{ was_username }} -password {{ was_password }}"
  register:      cout
  changed_when:  cout.rc == 0
  when:          dmgr_is_running.rc == 0
  retries: 3
  delay: 30
  until: cout is not search("is already in progress")

- name:          Wait for DMGR process to stop
  ansible.builtin.shell: >-
    ps -p "$(cat '{{ __was_install_location }}/profiles/{{ __profile_name }}/logs/dmgr/dmgr.pid')" > /dev/null
  register:      dmgr_stopped_check
  failed_when:   false
  changed_when:  false
  retries:       5
  delay:         2
  until:         dmgr_stopped_check.rc != 0

- name:          "Is dmgr Running?"
  shell:         "ps -p `cat '{{ __was_install_location }}/profiles/{{ __profile_name }}/logs/dmgr/dmgr.pid'` > /dev/null"
  register:      dmgr_is_running
  failed_when:   false
  changed_when:  false

- name:          "Start Dmgr"
  command:       "{{ __was_install_location }}/profiles/{{ __profile_name }}/bin/startManager.sh"
  register:      dmgr_start
  changed_when:  dmgr_start.rc == 0
  failed_when:   dmgr_start.rc != 0
  when:          dmgr_is_running.rc != 0
  retries: 3
  delay: 30
  until: dmgr_start is not search("is already in progress")

- name:          "Is dmgr Running?"
  shell:         "ps -p `cat '{{ __was_install_location }}/profiles/{{ __profile_name }}/logs/dmgr/dmgr.pid'` > /dev/null"
  register:      dmgr_is_running
  failed_when:   false
  changed_when:  false
  when:          (dmgr_start.rc is defined) and (dmgr_start.rc == 0)

- name:          Discover DMGR SOAP port
  ansible.builtin.include_role:
    name: roles/third_party/ibm/wasnd/was-dmgr-soap-port

- name:          Wait for DMGR SOAP endpoint to become available
  ansible.builtin.wait_for:
    host:         127.0.0.1
    port:         "{{ dmgr_soap_port_effective }}"
    state:        started
    delay:        5
    timeout:      300
  when:          (dmgr_start.rc is defined) and (dmgr_start.rc == 0)
