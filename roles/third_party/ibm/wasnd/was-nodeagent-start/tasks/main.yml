---
- name:          "Is nodeagent Running?"
  shell:         "ps -p `cat '{{ __was_install_location }}/profiles/{{ __app_profile_name }}/logs/nodeagent/nodeagent.pid'` > /dev/null"
  register:      nodeagent_is_running
  failed_when:   false
  changed_when:  false
  when: pool_server is not defined

- name:          "Start nodeagent"
  command:       "{{ __was_install_location }}/profiles/{{ __app_profile_name }}/bin/startNode.sh"
  register:      dmgr_start
  changed_when:  dmgr_start.rc == 0
  failed_when:   dmgr_start.rc != 0
  when:          nodeagent_is_running.rc != 0 and pool_server is not defined

- name:          Find nodeagent serverindex.xml
  ansible.builtin.find:
    paths: "{{ __was_install_location }}/profiles/{{ __app_profile_name }}/config/cells"
    patterns: serverindex.xml
    recurse: true
    file_type: file
  register: nodeagent_serverindex_files
  changed_when: false
  when: (dmgr_start.rc is defined) and (dmgr_start.rc == 0) and pool_server is not defined

- name:          Read nodeagent serverindex.xml
  ansible.builtin.slurp:
    src: "{{ nodeagent_serverindex_files.files[0].path }}"
  register: nodeagent_serverindex
  when:
    - (dmgr_start.rc is defined) and (dmgr_start.rc == 0) and pool_server is not defined
    - nodeagent_serverindex_files.files | length > 0

- name:          Set nodeagent SOAP port
  ansible.builtin.set_fact:
    nodeagent_soap_port_effective: >-
      {{ (nodeagent_serverindex.content | b64decode
      | regex_search('SOAP_CONNECTOR_ADDRESS[\s\S]{0,500}?port=["\']([0-9]+)["\']', '\1'))[0] }}
  when:
    - (dmgr_start.rc is defined) and (dmgr_start.rc == 0) and pool_server is not defined
    - nodeagent_serverindex_files.files | length > 0

- name:          Wait for nodeagent SOAP endpoint
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ nodeagent_soap_port_effective | default(nodeagent_soap_port | default('8880')) }}"
    state: started
    delay: 2
    timeout: 300
  when: (dmgr_start.rc is defined) and (dmgr_start.rc == 0) and pool_server is not defined
