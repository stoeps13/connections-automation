---
- name:          Disable SELinux on RHEL8/RHEL9
  selinux:
    state:       disabled
  ignore_errors: true
  notify:        reboot
  when:
    - ansible_facts['os_family'] == "RedHat"
    - ansible_facts['distribution_major_version'] == "8" or ansible_facts['distribution_major_version'] == "9"

- name:          Install pre-requisites Yum on RHEL8/RHEL9
  yum:
    name:        ['gtk2', 'libXtst', 'xorg-x11-fonts-Type1', 'psmisc', 'libnsl', 'unzip']
    state:       present
  when:
    - ansible_facts['os_family'] == "RedHat" or "AlmaLinux"
    - ansible_facts['distribution_major_version'] == "8" or ansible_facts['distribution_major_version'] == "9"
