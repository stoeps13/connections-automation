---
- name: Find DMGR serverindex.xml
  ansible.builtin.find:
    paths: "{{ __was_install_location }}/profiles/{{ __profile_name }}/config/cells"
    patterns: serverindex.xml
    recurse: true
    file_type: file
  register: dmgr_serverindex_files
  changed_when: false

- name: Read DMGR serverindex.xml
  ansible.builtin.slurp:
    src: "{{ dmgr_serverindex_files.files[0].path }}"
  register: dmgr_serverindex
  when: dmgr_serverindex_files.files | length > 0

- name: Set discovered DMGR SOAP port
  ansible.builtin.set_fact:
    dmgr_soap_port_effective: >-
      {{ (dmgr_serverindex.content | b64decode
      | regex_search('SOAP_CONNECTOR_ADDRESS[\s\S]{0,500}?port=["\']([0-9]+)["\']', '\1'))[0] }}
  when:
    - dmgr_soap_port is not defined
    - dmgr_serverindex_files.files | length > 0

- name: Set configured or fallback DMGR SOAP port
  ansible.builtin.set_fact:
    dmgr_soap_port_effective: "{{ dmgr_soap_port | default('8879') }}"
  when: dmgr_soap_port_effective is not defined
