---
- name:                 Set external domain
  set_fact:
    __sso_external:     "{{ cnx_application_ingress.split('.')[1:] | join('.') }}"

- name:                 Multiple domains SSO
  set_fact:
    __sso_domainnames:  ".{{ ansible_facts['domain'] }};.{{ __sso_external }}"
  when:
    - ansible_facts['domain'] != __sso_external
    - ansible_facts['domain'] != ""

- name:                 Single domain SSO (empty ansible_facts['domain'])
  set_fact:
    __sso_domainnames:  ".{{ __sso_external }}"
  when:
    - ansible_facts['domain'] != __sso_external
    - ansible_facts['domain'] == ""

- debug: var=__sso_domainnames
  run_once: true

- name:                 Single domain SSO
  set_fact:
    __sso_domainnames: ".{{ ansible_facts['domain'] }}"
  when:
    - ansible_facts['domain'] == __sso_external

- debug: var=__sso_domainnames
  run_once: true
