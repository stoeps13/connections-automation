---
- name: Create IBM interim-fix directory
  ansible.builtin.file:
    path: "{{ __ibm_ifix_tmp_dir }}"
    state: directory
    mode: "0755"

- name: Create individual IBM interim-fix directories
  ansible.builtin.file:
    path: "{{ __ibm_ifix_tmp_dir }}/{{ item.file_name | basename | splitext | first }}"
    state: directory
    mode: "0755"
  loop: "{{ __ibm_ifix_files }}"

- name: Extract IBM interim-fix repositories
  ansible.builtin.unarchive:
    src: "{{ was_fixes_repository_url }}/{{ item.file_name }}"
    dest: "{{ __ibm_ifix_tmp_dir }}/{{ item.file_name | basename | splitext | first }}"
    remote_src: true
    validate_certs: false
    creates: "{{ __ibm_ifix_tmp_dir }}/{{ item.file_name | basename | splitext | first }}/repository.config"
  loop: "{{ __ibm_ifix_files }}"

- name: Stop WebSphere application servers
  ansible.builtin.include_role:
    name: roles/third_party/ibm/wasnd/was-dmgr-stop-cluster

- name: Stop WebSphere deployment manager
  ansible.builtin.include_role:
    name: roles/third_party/ibm/wasnd/was-dmgr-stop

- name: Stop WebSphere node agents
  ansible.builtin.include_role:
    name: roles/third_party/ibm/wasnd/was-nodeagent-stop

- name: Stop IBM HTTP Server
  ansible.builtin.include_role:
    name: roles/third_party/ibm/ihs/ibm-http-server-stop

- name: Stop IBM HTTP Server adminctl
  ansible.builtin.include_role:
    name: roles/third_party/ibm/ihs/ibm-http-adminctl-stop

- name: Check for remaining WebSphere and IHS processes
  ansible.builtin.shell: >-
    pgrep -af 'java|httpd|adminctl' || true
  register: remaining_ibm_processes
  changed_when: false

- name: Wait for WebSphere and IHS processes to stop
  ansible.builtin.shell: >-
    pgrep -f 'java|httpd|adminctl'
  register: process_check
  until: process_check.rc != 0
  retries: 12
  delay: 5
  changed_when: false
  failed_when: false

- name: Force-stop remaining WebSphere and IHS processes
  ansible.builtin.shell: >-
    pkill -9 -f '/opt/IBM/(WebSphere|HTTPServer)' || true
  when: process_check.rc == 0
  changed_when: process_check.rc == 0

- name: Apply applicable IBM interim fixes
  ansible.builtin.command:
    cmd: >-
      {{ __iim_install_location }}/eclipse/tools/imcl updateAll
      -repositories {{ __ibm_ifix_files | map(attribute='file_name')
      | map('basename') | map('splitext') | map('first')
      | map('regex_replace', '^', __ibm_ifix_tmp_dir ~ '/')
      | map('regex_replace', '$', '/repository.config') | join(',') }}
      -installFixes all -acceptLicense
      -log {{ __log_file }}
  register: ibm_ifix_update
  changed_when: ibm_ifix_update.rc == 0

- name: Remove IBM interim-fix archives
  ansible.builtin.file:
    path: "{{ __ibm_ifix_tmp_dir }}"
    state: absent
  when: not (iim_keep_fetched_files | default(false) | bool)
