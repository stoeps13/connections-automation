---
- name: Install pre-requisites Yum for CentOS 7 - epel-release
  ansible.builtin.package:
    name:
    - "epel-release"
    enablerepo: "extras"
    state: present
  when:
  - ansible_facts['distribution']== "CentOS"
  - ansible_facts['distribution_major_version'] == "7"

- name: Install python pre-requisites for Pexpect for CentOS7
  ansible.builtin.package:
    name:
    - "python-setuptools"
    - "python2"
    - "python-pip"
    state: present
  when:
  - ansible_facts['distribution']== "CentOS"
  - ansible_facts['distribution_major_version'] == "7"

- name: Install pre-requisites Yum
  ansible.builtin.package:
    name:
    - "python3-pip"
    - "httpd-tools"
    state: present
  when:
  - ansible_facts['os_family'] == "RedHat"

- name:                       Install pre-requisites Zypper for SUSE
  zypper:
    name:                     ['python3-pip', 'acl', 'python311-pexpect']
    state:                    present
  when:
    - ansible_distribution == "SLES"

- name:                       Install Pexpect
  pip:
    name:                     pexpect
    state:                    latest
  when:
    - ansible_distribution != "SLES"  