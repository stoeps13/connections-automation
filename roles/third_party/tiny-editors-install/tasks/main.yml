---
- name: Setup OS
  ansible.builtin.include_tasks: setup_os.yml

- name: Create Tiny Editors user for Tiny Editors installation
  ansible.builtin.include_tasks: create_tiny_editors_user.yml

- name: Download TinyEditors installer to Tiny Editors env
  ansible.builtin.include_tasks: download_tiny_editors.yml
  when:
   - __setup_environment |bool
   - inventory_hostname in groups["dmgr"]

- name: Install Tiny Editors
  ansible.builtin.include_tasks: install_tiny_editors.yml
  when:
   - inventory_hostname in groups["dmgr"]

- name: Render Tiny Editors configurations
  ansible.builtin.include_tasks: render_tiny_editor_configurations.yml
  when:
   - inventory_hostname in groups["cnx_was_servers"]
