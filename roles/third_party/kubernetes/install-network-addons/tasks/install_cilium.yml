---
- name: Create .kube folder
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Enable kubectl for root
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    owner: root
    group: root
    mode: "0640"
    remote_src: true

- name: Download cilium binary
  ansible.builtin.shell: |
    CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
    CLI_ARCH=amd64
    if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
    curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
    sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
    sudo tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
    rm cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
  become: true
  ignore_errors: true

- name: Check whether the Cilium Helm release exists
  ansible.builtin.command:
    cmd: helm status cilium --namespace kube-system
  register: cilium_release
  changed_when: false
  failed_when: false

- name: Install Cilium
  ansible.builtin.command:
    cmd: /usr/local/bin/cilium install --version {{ __cilium_version }}
  when: cilium_release.rc != 0

- name: Upgrade Cilium
  ansible.builtin.command:
    cmd: /usr/local/bin/cilium upgrade --version {{ __cilium_version }}
  when: cilium_release.rc == 0
