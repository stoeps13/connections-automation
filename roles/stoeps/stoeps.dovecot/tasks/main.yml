---
# tasks file for stoeps.dovecot
- name: Create virtual user
  ansible.builtin.user:
    name: vmail
    state: present
    shell: /sbin/nologin
    uid: 20000

- name: Install prerequisits
  ansible.builtin.dnf:
    name:
      - dovecot
    state: present
  when:
    - ansible_facts['os_family'] == "RedHat"

- name: Set listen in /etc/dovecot/dovecot.conf
  ansible.builtin.lineinfile:
    path: /etc/dovecot/dovecot.conf
    regexp: '^#listen\s='
    line: listen = *
  notify: Dovecot restart

- name: Set listen in /etc/dovecot/conf.d/10-mail.conf
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-mail.conf
    regexp: '^#mail_location\s='
    line: mail_location = maildir:/home/vmail/%d/%n/Maildir
  notify: Dovecot restart

- name: Set /etc/dovecot/conf.d/10-auth.conf
  ansible.builtin.template:
    src: 10-auth.j2.conf
    dest: /etc/dovecot/conf.d/10-auth.conf
    owner: root
    group: root
    mode: "0644"
    backup: false
  notify: Dovecot restart

- name: Set /etc/dovecot/conf.d/auth-passwdfile.conf.ext
  ansible.builtin.template:
    src: auth-passwdfile.conf.ext.j2
    dest: /etc/dovecot/conf.d/auth-passwdfile.conf.ext
    owner: root
    group: root
    mode: "0644"
    backup: false
  notify: Dovecot restart

- name: Set /etc/dovecot/conf.d/auth-static.conf.ext
  ansible.builtin.template:
    src: auth-static.conf.ext.j2
    dest: /etc/dovecot/conf.d/auth-static.conf.ext
    owner: root
    group: root
    mode: "0644"
    backup: false
  notify: Dovecot restart

- name: Set /etc/dovecot/conf.d/10-master.conf
  ansible.builtin.blockinfile:
    path: /etc/dovecot/conf.d/10-master.conf
    block: |
      unix_listener /var/spool/postfix/private/auth {
        mode = 0666
        user = postfix
        group = postfix
      }
    insertafter: '^\s\s# Postfix\ssmtp-auth'

- name: Set listen in /etc/dovecot/conf.d/10-ssl.conf
  ansible.builtin.lineinfile:
    path: /etc/dovecot/conf.d/10-ssl.conf
    regexp: '^ssl\s=\srequired'
    line: ssl = yes
  notify: Dovecot restart

- name: Generate user accounts config
  ansible.builtin.template:
    src: users.j2 # Path to your Jinja2 template
    dest: /etc/dovecot/users
    owner: root
    group: root
    mode: "0644"
  vars:
    user_ids: "{{ range(1, 100) | list }}"
  notify: Postfix restart

- name: Enable Systemd service
  ansible.builtin.systemd_service:
    name: dovecot.service
    state: started
    enabled: true
